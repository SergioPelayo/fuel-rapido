<!-- Fuel Rápido — marca de la app.
     Símbolo de Pelayo Ingeniería Digital: dos gotas, velocidad y medición.
     Va sin las palabras "Fast Fuel" a propósito: el nombre lo pone el texto
     de la interfaz, y así el símbolo se lee también a 22 px.
     El rayo y el marcador van centrados en la parte redonda de cada gota,
     cuya circunferencia tiene radio 19 y centro (32,39). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fuel Rápido">
  <title>Fuel Rápido</title>

  <!-- Gota izquierda: roja con filo oscuro, y el rayo -->
  <g transform="translate(-3.5,3) scale(0.80)">
    <path d="M32 4C32 4 13 26 13 39a19 19 0 0 0 38 0C51 26 32 4 32 4Z" fill="#f4333c" stroke="#0b0f14" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M36 25 L24 42h7l-3 13L40 38h-7Z" fill="#f9b233"/>
  </g>

  <!-- Gota derecha: oscura con filo rojo, y el marcador -->
  <g transform="translate(23,10.5) scale(0.66)">
    <path d="M32 4C32 4 13 26 13 39a19 19 0 0 0 38 0C51 26 32 4 32 4Z" fill="#221f20" stroke="#f4333c" stroke-width="6" stroke-linejoin="round"/>
    <path d="M20 44a12 12 0 0 1 24 0" fill="none" stroke="#f4333c" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M32 44 L41 36" stroke="#f4333c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="44" r="4" fill="#f4333c"/>
  </g>
</svg>
